<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="app-header">
  <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-wave-square"></i></div>
  <div class="brand-copy">
    <h1>LunchPulse</h1>
    <p>팀의 대화가 오늘의 선택이 되는 곳</p>
  </div>
  <div class="header-status">
    <a class="admin-link" th:href="@{/admin/dashboard}" aria-label="운영자 대시보드로 이동">
      <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
      <span>운영 콘솔</span>
    </a>
    <div id="live-timer" class="time-pill">00:00:00</div>
    <div class="live-pill" aria-label="현재 실시간 접속자">
      <span aria-hidden="true"></span> LIVE <strong id="user-count">0</strong>
    </div>
  </div>
</header>
</html>
