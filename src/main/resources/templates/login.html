<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<th:block layout:fragment="content">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-copy">
                <span class="login-kicker">BubbleTalk Operations</span>
                <h1>운영자 로그인</h1>
                <p>실시간 채팅방, 투표 상태, 보안 이벤트 로그를 관리하는 운영 콘솔입니다.</p>
                <div class="login-signal-grid">
                    <div><i class="fa-solid fa-chart-line"></i><span>실시간 지표</span></div>
                    <div><i class="fa-solid fa-shield-halved"></i><span>운영 로그</span></div>
                    <div><i class="fa-solid fa-comments"></i><span>채팅방 제어</span></div>
                </div>
            </div>

            <form class="login-form" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="login-form-head">
                    <div class="login-lock"><i class="fa-solid fa-lock"></i></div>
                    <div>
                        <strong>Admin Access</strong>
                        <span>권한이 있는 운영자만 접근할 수 있습니다.</span>
                    </div>
                </div>

                <div th:if="${param.error}" class="login-alert error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    아이디 또는 비밀번호를 확인해주세요.
                </div>
                <div th:if="${param.logout}" class="login-alert success">
                    <i class="fa-solid fa-circle-check"></i>
                    로그아웃되었습니다.
                </div>

                <label class="login-field">
                    <span>아이디</span>
                    <input type="text" name="username" autocomplete="username" required autofocus>
                </label>
                <label class="login-field">
                    <span>비밀번호</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>

                <button type="submit" class="login-submit">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    로그인
                </button>
            </form>
        </section>
    </main>
</th:block>
</html>
