<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<th:block layout:fragment="content">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const CLIENT_IP = /*[[${clientIp}]]*/ 'unknown';
        /*]]>*/
    </script>

    <section id="bamboo-forest" class="bubble-stage">
        <div class="stage-copy">
            <span class="eyebrow">Anonymous chat</span>
            <h2>점심 얘기는 가볍게, 투표는 바로.</h2>
        </div>
        <div id="bullet-container" class="bullet-layer"></div>
        <div class="chat-input-wrap">
            <form id="msg-form" class="chat-form">
                <input type="text" id="msg-input" placeholder="익명으로 한마디 남기기">
                <button type="submit" aria-label="메시지 보내기">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </form>
        </div>
    </section>

    <div id="h-resizer" class="stage-resizer">
        <div></div>
    </div>

    <main class="app-main custom-scroll">
        <aside class="side-panel">
            <section class="info-card time-card">
                <div class="info-icon coral">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div>
                    <span>남은 시간</span>
                    <strong id="war-timer">--:--:--</strong>
                </div>
            </section>

            <section class="info-card">
                <div class="info-icon yellow">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div>
                    <span>어제의 메뉴</span>
                    <strong id="yesterday-winner">불러오는 중</strong>
                </div>
            </section>

            <section class="note-panel">
                <h3>오늘 규칙</h3>
                <p>메뉴 추가는 0표로 등록되고, 투표는 메뉴마다 한 번씩 가능합니다.</p>
            </section>
            <section class="note-panel">
                <h3>채팅방</h3>
                <form id="room-create-form" class="add-menu-form">
                    <input type="text" id="room-name-input" placeholder="방 이름">
                    <button type="submit">생성</button>
                </form>
                <form id="room-code-form" class="add-menu-form">
                    <input type="text" id="room-code-input" placeholder="방 코드">
                    <button type="submit">입장</button>
                </form>
                <div id="current-room-label">전역 채팅</div>
                <div id="room-list"></div>
            </section>
        </aside>

        <section class="content-panel">
            <div id="state-locked" class="state-panel hidden">
                <div class="state-icon">
                    <i class="fa-solid fa-hourglass-start"></i>
                </div>
                <h2>투표 대기 중</h2>
                <p>관리자가 투표를 열면 메뉴를 추가하고 투표할 수 있습니다.</p>
            </div>

            <div id="state-voting" class="vote-panel">
                <div class="panel-head">
                    <div>
                        <span class="eyebrow">Lunch board</span>
                        <h2>오늘의 점심 후보</h2>
                    </div>
                    <div class="board-badge">
                        <i class="fa-solid fa-utensils"></i>
                        실시간 투표
                    </div>
                </div>

                <form id="add-menu-form" class="add-menu-form">
                    <input type="text" id="add-menu-input" placeholder="메뉴 후보 추가하기">
                    <button type="submit">
                        <i class="fa-solid fa-plus"></i>
                        추가
                    </button>
                </form>

                <div id="voting-grid" class="menu-grid">
                </div>
            </div>

            <div id="state-finished" class="result-panel hidden">
                <div class="panel-head centered">
                    <span class="eyebrow">Final result</span>
                    <h2>오늘의 선택</h2>
                </div>

                <div class="podium-wrap">
                    <div class="podium-item second">
                        <span id="rank-2-name">-</span>
                        <div class="podium-bar podium-2">2</div>
                    </div>
                    <div class="podium-item first">
                        <i class="fa-solid fa-crown"></i>
                        <span id="rank-1-name">-</span>
                        <div class="podium-bar podium-1">1</div>
                    </div>
                    <div class="podium-item third">
                        <span id="rank-3-name">-</span>
                        <div class="podium-bar podium-3">3</div>
                    </div>
                </div>

                <div id="full-ranking" class="ranking-list hidden">
                    <h4>전체 순위</h4>
                    <div id="ranking-list"></div>
                </div>

                <button id="btn-show-more" onclick="MAINJS.showFullRanking()" class="show-more-btn">
                    전체 순위 보기
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
        </section>
    </main>
</th:block>
</html>
