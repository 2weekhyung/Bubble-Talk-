
services:
  # 1. MySQL Database
  db:
    image: mysql:8.0
    container_name: bubble-mysql
    restart: always
    environment:
      MYSQL_DATABASE: bubbletalk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    # 메모리 사용량 제한 (Micro 서버 안정용)
    deploy:
      resources:
        limits:
          memory: 400M

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: bubble-redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M

  # 3. Spring Boot Application
  app:
    build: .
    image: wngude/bubble-app:latest  # 사용자님의 도커 허브 이미지
    container_name: bubble-app
    restart: always
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    environment:
      # 서버 내부 통신이므로 전과 동일하게 'db', 'redis' 서비스명을 호스트로 사용합니다.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bubbletalk?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      # Dockerfile의 ENTRYPOINT에서 설정한 prod 프로필 활성화 확인
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: 400M
