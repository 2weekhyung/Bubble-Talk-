
services:
  # 1. MySQL Database
  db:
    image: mysql:8.0
    container_name: lunchpulse-mysql
    restart: always
    environment:
      MYSQL_DATABASE: bubbletalk
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bubble_root_local}
      MYSQL_USER: ${MYSQL_USER:-bubble_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bubble_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    # 메모리 사용량 제한 (Micro 서버 안정용)
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-bubble_root_local}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. Redis
  redis:
    image: redis:alpine
    container_name: lunchpulse-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Spring Boot Application
  app:
    build: .
    image: lunchpulse-app:local
    container_name: lunchpulse-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bubbletalk?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-bubble_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-bubble_local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-local}
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: 400M
